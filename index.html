<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Strip — Weather Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0B1220;
    --bg-panel:#121B30;
    --bg-panel-hover:#16213B;
    --line-indigo:#243252;
    --twilight:#1B2A4A;
    --coral:#FF8B5E;
    --gold:#FFC857;
    --sky-pale:#E8EEF5;
    --mist:#8B9AB3;
    --mist-dim:#5C6A85;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%;}
  body{
    background:var(--bg-void);
    color:var(--sky-pale);
    font-family:'Inter', sans-serif;
    height:100vh;
    padding:28px 32px 24px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .wrap{width:100%; height:100%; display:flex; flex-direction:column; flex:1; min-height:0;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:28px;
    border-bottom:1px solid var(--line-indigo);
    padding-bottom:18px;
    flex:0 0 auto;
  }
  .brand-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--coral);
    margin-bottom:8px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:32px;
    letter-spacing:-0.01em;
  }
  .clock-local{
    font-family:'JetBrains Mono', monospace;
    font-size:19px;
    color:var(--mist);
    text-align:right;
  }

  .panels{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
    flex:1;
    min-height:0;
  }
  @media (max-width:900px){
    body{height:auto; overflow:auto;}
    .panels{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--bg-panel);
    border:1px solid var(--line-indigo);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:100%;
    min-height:0;
  }

  .panel-sky{
    padding:22px 22px 18px;
    position:relative;
    transition:background 0.6s ease;
    flex:0 0 auto;
  }

  .panel-topline{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:22px;
  }

  .city-slot{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .city-name{
    font-family:'Space Grotesk', sans-serif;
    font-size:29px;
    font-weight:600;
  }
  .city-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:17px;
    color:rgba(232,238,245,0.85);
    letter-spacing:0.04em;
  }
  .city-clock{
    font-family:'JetBrains Mono', monospace;
    font-size:20px;
    font-weight:600;
    color:var(--gold);
    letter-spacing:0.02em;
    margin-top:2px;
  }
  .topline-actions{
    display:flex;
    flex-direction:column;
    gap:6px;
    align-items:flex-end;
  }
  .change-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    background:rgba(0,0,0,0.25);
    border:1px solid rgba(232,238,245,0.25);
    color:var(--sky-pale);
    padding:6px 10px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
  }
  .change-btn:hover{background:rgba(0,0,0,0.4);}
  .locate-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    background:rgba(255,200,87,0.15);
    border:1px solid rgba(255,200,87,0.45);
    color:var(--gold);
    padding:6px 10px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
  }
  .locate-btn:hover{background:rgba(255,200,87,0.28);}
  .locate-btn:disabled{opacity:0.6; cursor:default;}

  .now-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:6px;
  }
  .now-temp{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:96px;
    line-height:1;
  }
  .now-icon{
    font-size:96px;
    line-height:1;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    background:rgba(11,18,32,0.35);
    border-radius:50%;
    padding:6px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .now-desc{
    font-family:'Inter', sans-serif;
    font-size:21px;
    font-weight:500;
    color:rgba(255,255,255,0.95);
  }
  .now-meta{
    display:flex;
    gap:16px;
    margin-top:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:17px;
    color:rgba(232,238,245,0.85);
  }
  .now-meta span b{color:var(--sky-pale); font-weight:600;}

  .hourly-section{
    background:var(--bg-panel);
    padding:18px 18px 22px;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }
  .hourly-label{
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--mist);
    margin-bottom:10px;
  }
  .graph-holder{margin-bottom:8px;}
  svg{display:block; width:100%; height:auto;}

  .hour-scroll{
    display:flex;
    overflow-x:auto;
    gap:0;
    scrollbar-width:thin;
    scrollbar-color:var(--line-indigo) transparent;
    padding-bottom:4px;
    margin-top:6px;
  }
  .hour-scroll::-webkit-scrollbar{height:5px;}
  .hour-scroll::-webkit-scrollbar-thumb{background:var(--line-indigo); border-radius:6px;}

  .hour-item{
    flex:0 0 auto;
    width:93px;
    text-align:center;
    padding:6px 0;
    border-right:1px solid rgba(255,255,255,0.03);
  }
  .hour-item.now{
    background:rgba(255,139,94,0.08);
    border-radius:6px;
  }
  .hour-time{
    font-family:'JetBrains Mono', monospace;
    font-size:17px;
    font-weight:500;
    color:var(--sky-pale);
    margin-bottom:6px;
  }
  .hour-icon{
    font-size:45px;
    margin-bottom:6px;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .hour-temp{
    font-family:'JetBrains Mono', monospace;
    font-size:20px;
    font-weight:700;
    color:var(--sky-pale);
  }
  .hour-precip{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    color:#6FA8D6;
    margin-top:4px;
  }
  .hour-wind{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    color:#9AAEC7;
    margin-top:2px;
  }



  .status-msg{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--mist);
    padding:40px 20px;
    text-align:center;
  }

  /* search overlay */
  .search-overlay{
    position:fixed;
    inset:0;
    background:rgba(6,10,20,0.7);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .search-overlay.open{display:flex;}
  .search-box{
    background:var(--bg-panel);
    border:1px solid var(--line-indigo);
    border-radius:12px;
    width:100%;
    max-width:420px;
    padding:20px;
  }
  .search-box h3{
    font-family:'Space Grotesk', sans-serif;
    font-size:16px;
    margin-bottom:14px;
    font-weight:600;
  }
  .search-box input{
    width:100%;
    background:var(--bg-void);
    border:1px solid var(--line-indigo);
    color:var(--sky-pale);
    padding:10px 12px;
    border-radius:8px;
    font-family:'Inter', sans-serif;
    font-size:14px;
    margin-bottom:12px;
  }
  .search-box input:focus{outline:1px solid var(--coral);}
  .search-results{max-height:260px; overflow-y:auto;}
  .search-result{
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    display:flex;
    justify-content:space-between;
  }
  .search-result:hover{background:var(--bg-panel-hover);}
  .search-result-name{font-weight:500;}
  .search-result-region{color:var(--mist-dim); font-size:11px;}
  .search-close{
    margin-top:14px;
    width:100%;
    background:transparent;
    border:1px solid var(--line-indigo);
    color:var(--mist);
    padding:9px;
    border-radius:8px;
    cursor:pointer;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .search-close:hover{color:var(--sky-pale); border-color:var(--mist);}

  footer{
    margin-top:14px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--mist-dim);
    letter-spacing:0.04em;
    flex:0 0 auto;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand-eyebrow">◐ Weather Dashboard panel</div>
      <h1>Sky Strip</h1>
    </div>
    <div class="clock-local" id="fetchedAt"></div>
  </header>

  <div class="panels" id="panels"></div>

  <footer>Data: Open-Meteo — updates on load · Click "Change" to swap a city</footer>
</div>

<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <h3>Choose a city or suburb</h3>
    <input type="text" id="searchInput" placeholder="Search any city worldwide…" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
    <button class="search-close" onclick="closeSearch()">Cancel</button>
  </div>
</div>

<script>
const WEATHER_ICONS = {
  0:'☀️',1:'🌤️',2:'⛅',3:'☁️',
  45:'🌫️',48:'🌫️',
  51:'🌦️',53:'🌦️',55:'🌦️',
  56:'🌧️',57:'🌧️',
  61:'🌧️',63:'🌧️',65:'🌧️',
  66:'🌧️',67:'🌧️',
  71:'🌨️',73:'🌨️',75:'🌨️',77:'🌨️',
  80:'🌦️',81:'🌧️',82:'⛈️',
  85:'🌨️',86:'🌨️',
  95:'⛈️',96:'⛈️',99:'⛈️'
};
const WEATHER_DESC = {
  0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',
  45:'Fog',48:'Rime fog',
  51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',
  56:'Freezing drizzle',57:'Freezing drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',
  66:'Freezing rain',67:'Freezing rain',
  71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',
  80:'Rain showers',81:'Rain showers',82:'Violent showers',
  85:'Snow showers',86:'Snow showers',
  95:'Thunderstorm',96:'Thunderstorm w/ hail',99:'Thunderstorm w/ hail'
};

const MOON_SVG = '<svg viewBox="0 0 24 24" style="width:1em;height:1em;display:inline-block;vertical-align:-0.08em;"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" fill="#6FA8D6"/></svg>';

const WEATHER_ICONS_NIGHT = {
  0:MOON_SVG,1:MOON_SVG,2:'☁️',3:'☁️'
};

function iconFor(code, isDay){
  if(isDay === 0 && WEATHER_ICONS_NIGHT[code]) return WEATHER_ICONS_NIGHT[code];
  return WEATHER_ICONS[code] ?? '🌡️';
}
function descFor(code){ return WEATHER_DESC[code] ?? 'Unknown'; }

// default three cities (used if nothing saved yet)
const DEFAULT_CITIES = [
  { name:'Melbourne', region:'Victoria, AU', lat:-37.8136, lon:144.9631 },
  { name:'Sydney', region:'New South Wales, AU', lat:-33.8688, lon:151.2093 },
  { name:'Brisbane', region:'Queensland, AU', lat:-27.4698, lon:153.0251 }
];

const STORAGE_KEY = 'sky-strip-cities';
const REFRESH_MS = 15 * 60 * 1000; // auto-refresh every 15 minutes

function loadSavedCities(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(Array.isArray(parsed) && parsed.length===3) return parsed;
    return null;
  }catch(e){
    return null;
  }
}

function saveCities(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cities));
  }catch(e){
    // storage unavailable — dashboard still works, just won't persist
  }
}

let cities = loadSavedCities() || DEFAULT_CITIES.slice();

// preset quick-pick list — Australian cities plus major world cities
const QUICK_PICK_CITIES = [
  { name:'Sydney', region:'New South Wales, AU', lat:-33.8688, lon:151.2093 },
  { name:'Melbourne', region:'Victoria, AU', lat:-37.8136, lon:144.9631 },
  { name:'Brisbane', region:'Queensland, AU', lat:-27.4698, lon:153.0251 },
  { name:'Perth', region:'Western Australia, AU', lat:-31.9505, lon:115.8605 },
  { name:'Adelaide', region:'South Australia, AU', lat:-34.9285, lon:138.6007 },
  { name:'Canberra', region:'Australian Capital Territory, AU', lat:-35.2809, lon:149.1300 },
  { name:'Hobart', region:'Tasmania, AU', lat:-42.8821, lon:147.3272 },
  { name:'Darwin', region:'Northern Territory, AU', lat:-12.4634, lon:130.8456 },
  { name:'Tokyo', region:'Japan', lat:35.6762, lon:139.6503 },
  { name:'Singapore', region:'Singapore', lat:1.3521, lon:103.8198 },
  { name:'London', region:'United Kingdom', lat:51.5072, lon:-0.1276 },
  { name:'Paris', region:'France', lat:48.8566, lon:2.3522 },
  { name:'New York', region:'NY, United States', lat:40.7128, lon:-74.0060 },
  { name:'Los Angeles', region:'CA, United States', lat:34.0522, lon:-118.2437 },
  { name:'Dubai', region:'United Arab Emirates', lat:25.2048, lon:55.2708 },
  { name:'Auckland', region:'New Zealand', lat:-36.8485, lon:174.7633 },
  { name:'Bali', region:'Indonesia', lat:-8.3405, lon:115.0920 },
  { name:'Jakarta', region:'Indonesia', lat:-6.2088, lon:106.8456 },
  { name:'Hong Kong', region:'Hong Kong', lat:22.3193, lon:114.1694 },
  { name:'Cape Town', region:'South Africa', lat:-33.9249, lon:18.4241 }
];

let activeSlot = null;

async function fetchWeather(city){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&hourly=temperature_2m,weathercode,precipitation_probability,is_day,wind_speed_10m&current=temperature_2m,weathercode,relative_humidity_2m,wind_speed_10m,is_day&timezone=auto&forecast_days=2`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Weather fetch failed');
  return res.json();
}

function buildGraph(temps, width=460, height=70){
  const min = Math.min(...temps);
  const max = Math.max(...temps);
  const range = (max - min) || 1;
  const stepX = width / (temps.length - 1);
  const pts = temps.map((t,i)=>{
    const x = i*stepX;
    const y = height - ((t-min)/range)*(height-16) - 8;
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = path + ` L${width},${height} L0,${height} Z`;
  return `
  <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="grad-${Math.random().toString(36).slice(2)}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FF8B5E" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#FF8B5E" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${areaPath}" fill="rgba(255,139,94,0.12)"/>
    <path d="${path}" fill="none" stroke="#FF8B5E" stroke-width="1.8"/>
  </svg>`;
}

function skyGradientFor(hourOfDay){
  // hourOfDay: 0-23 local hour, returns a css gradient string
  if(hourOfDay>=6 && hourOfDay<9) return 'linear-gradient(160deg, #2B3E63 0%, #6B5B7A 55%, #C97B5E 100%)'; // dawn
  if(hourOfDay>=9 && hourOfDay<17) return 'linear-gradient(160deg, #1B2A4A 0%, #24406B 100%)'; // day
  if(hourOfDay>=17 && hourOfDay<20) return 'linear-gradient(160deg, #1B2A4A 0%, #6B3F52 55%, #C97B5E 100%)'; // dusk
  return 'linear-gradient(160deg, #0B1220 0%, #151F38 100%)'; // night
}

function renderPanel(slotIndex, city, data){
  const panel = document.getElementById('panel-'+slotIndex);
  if(!data){
    panel.innerHTML = `<div class="status-msg">Couldn't load forecast for ${city.name}. Try changing the city.</div>`;
    cityOffsets[slotIndex] = null;
    return;
  }
  const cur = data.current;
  // NOTE: Open-Meteo returns time strings local to the CITY, with no offset attached
  // (e.g. "2026-07-28T14:00"). new Date(...) on a string like this gets reinterpreted
  // using the BROWSER's timezone, not the city's — so we compare/parse the strings
  // directly instead of going through Date().
  // match the hourly slot for the current HOUR (ignore minutes) — current.time has
  // minute precision (e.g. "14:15") but hourly.time is only on the hour ("14:00"),
  // so comparing full timestamps would skip ahead to the next hour whenever the
  // current time isn't exactly on the hour.
  const currentHourPrefix = cur.time.slice(0,13); // "YYYY-MM-DDTHH"
  let startIdx = data.hourly.time.findIndex(t => t.slice(0,13) === currentHourPrefix);
  if(startIdx < 0) startIdx = data.hourly.time.findIndex(t => t >= cur.time);
  if(startIdx < 0) startIdx = 0;

  const next24Temps = data.hourly.temperature_2m.slice(startIdx, startIdx+24);
  const localHour = parseInt(cur.time.slice(11,13), 10);
  const skyBg = skyGradientFor(localHour);

  // store this city's UTC offset + abbreviation so the clock can tick live
  cityOffsets[slotIndex] = {
    offsetSeconds: data.utc_offset_seconds,
    abbr: data.timezone_abbreviation || ''
  };

  function formatHourLabel(timeStr){
    const h = parseInt(timeStr.slice(11,13), 10);
    const period = h < 12 ? 'AM' : 'PM';
    let h12 = h % 12;
    if(h12 === 0) h12 = 12;
    return `${h12}${period}`;
  }

  let hourItems = '';
  for(let i=startIdx; i<startIdx+24 && i<data.hourly.time.length; i++){
    const label = i===startIdx ? 'Now' : formatHourLabel(data.hourly.time[i]);
    hourItems += `
      <div class="hour-item ${i===startIdx?'now':''}">
        <div class="hour-time">${label}</div>
        <div class="hour-icon">${iconFor(data.hourly.weathercode[i], data.hourly.is_day[i])}</div>
        <div class="hour-temp">${Math.round(data.hourly.temperature_2m[i])}°</div>
        <div class="hour-precip">💧 ${data.hourly.precipitation_probability[i]}%</div>
        <div class="hour-wind">💨 ${Math.round(data.hourly.wind_speed_10m[i])}</div>
      </div>`;
  }

  panel.innerHTML = `
    <div class="panel-sky" style="background:${skyBg}">
      <div class="panel-topline">
        <div class="city-slot">
          <div class="city-name">${city.name}</div>
          <div class="city-sub">${city.region}</div>
          <div class="city-clock" id="clock-${slotIndex}">--:--:--</div>
        </div>
        <div class="topline-actions">
          ${slotIndex===0 ? `<button class="locate-btn" onclick="locateMe(${slotIndex})" id="locateBtn">📍 My location</button>` : ''}
          <button class="change-btn" onclick="openSearch(${slotIndex})">Change</button>
        </div>
      </div>
      <div class="now-row">
        <div class="now-temp">${Math.round(cur.temperature_2m)}°</div>
        <div class="now-icon">${iconFor(cur.weathercode, cur.is_day)}</div>
      </div>
      <div class="now-desc">${descFor(cur.weathercode)}</div>
      <div class="now-meta">
        <span>Humidity <b>${cur.relative_humidity_2m}%</b></span>
        <span>Wind <b>${Math.round(cur.wind_speed_10m)} km/h</b></span>
      </div>
    </div>
    <div class="hourly-section">
      <div class="hourly-label">Next 24 hours</div>
      <div class="graph-holder">${buildGraph(next24Temps)}</div>
      <div class="hour-scroll">${hourItems}</div>
    </div>
  `;
  updateClocks();
}

// live per-city clocks — one per panel, ticking every second off each city's UTC offset
let cityOffsets = [null, null, null];
function updateClocks(){
  cityOffsets.forEach((info, i) => {
    const el = document.getElementById('clock-'+i);
    if(!el || !info) return;
    const nowUtcMs = Date.now();
    const localMs = nowUtcMs + info.offsetSeconds*1000;
    const d = new Date(localMs);
    const hh = String(d.getUTCHours()).padStart(2,'0');
    const mm = String(d.getUTCMinutes()).padStart(2,'0');
    const ss = String(d.getUTCSeconds()).padStart(2,'0');
    el.textContent = `${hh}:${mm}:${ss}${info.abbr ? ' · '+info.abbr : ''}`;
  });
}
setInterval(updateClocks, 1000);

async function loadSlot(slotIndex){
  const panel = document.getElementById('panel-'+slotIndex);
  panel.innerHTML = `<div class="status-msg">Loading ${cities[slotIndex].name}…</div>`;
  try{
    const data = await fetchWeather(cities[slotIndex]);
    renderPanel(slotIndex, cities[slotIndex], data);
  }catch(e){
    renderPanel(slotIndex, cities[slotIndex], null);
  }
}

function renderAllPanels(){
  const container = document.getElementById('panels');
  container.innerHTML = cities.map((c,i)=>`<div class="panel" id="panel-${i}"><div class="status-msg">Loading ${c.name}…</div></div>`).join('');
  cities.forEach((c,i)=> loadSlot(i));
  document.getElementById('fetchedAt').textContent = 'Loaded ' + new Date().toLocaleString();
}

// search overlay logic
function renderCityList(list){
  const resultsEl = document.getElementById('searchResults');
  if(list.length===0){
    resultsEl.innerHTML = `<div class="status-msg" style="padding:14px 0;">No matches found.</div>`;
    return;
  }
  resultsEl.innerHTML = list.map(c=>`
    <div class="search-result" onclick='selectCity(${c.lat}, ${c.lon}, ${JSON.stringify(c.name)}, ${JSON.stringify(c.region)})'>
      <span class="search-result-name">${c.name}</span>
      <span class="search-result-region">${c.region}</span>
    </div>`).join('');
}

function openSearch(slotIndex){
  activeSlot = slotIndex;
  document.getElementById('searchOverlay').classList.add('open');
  document.getElementById('searchInput').value='';
  renderCityList(QUICK_PICK_CITIES);
  document.getElementById('searchInput').focus();
}
function closeSearch(){
  document.getElementById('searchOverlay').classList.remove('open');
  activeSlot = null;
}

let searchTimeout = null;
document.getElementById('searchInput').addEventListener('input', (e)=>{
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  if(q.length===0){ renderCityList(QUICK_PICK_CITIES); return; }
  if(q.length<2){ return; }
  searchTimeout = setTimeout(()=> doSearch(q), 300);
});

async function doSearch(q){
  const resultsEl = document.getElementById('searchResults');
  resultsEl.innerHTML = `<div class="status-msg" style="padding:14px 0;">Searching…</div>`;
  try{
    // count=15, worldwide (no country filter)
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=15&language=en&format=json`);
    const data = await res.json();
    const results = data.results || [];
    if(results.length===0){
      resultsEl.innerHTML = `<div class="status-msg" style="padding:14px 0;">No matches found.</div>`;
      return;
    }
    const mapped = results.map(r => ({
      name: r.name,
      region: [r.admin1, r.country].filter(Boolean).join(', ') || 'Unknown',
      lat: r.latitude,
      lon: r.longitude
    }));
    renderCityList(mapped);
  }catch(e){
    resultsEl.innerHTML = `<div class="status-msg" style="padding:14px 0;">Search failed. Try again.</div>`;
  }
}

function selectCity(lat, lon, name, region){
  if(activeSlot===null) return;
  const slotToUpdate = activeSlot;
  cities[slotToUpdate] = { name, region: region || '—', lat, lon };
  saveCities();
  closeSearch();
  loadSlot(slotToUpdate);
}

function locateMe(slotIndex){
  if(!navigator.geolocation){
    alert('Geolocation is not supported by this browser.');
    return;
  }
  const btn = document.getElementById('locateBtn');
  if(btn){ btn.disabled = true; btn.textContent = '📍 Locating…'; }

  navigator.geolocation.getCurrentPosition(
    async (pos)=>{
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      let name = 'My Location';
      let region = 'Current position';
      try{
        const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
        const data = await res.json();
        name = data.locality || data.city || data.principalSubdivision || 'My Location';
        region = [data.principalSubdivision, data.countryName].filter(Boolean).join(', ') || 'Current position';
      }catch(e){
        // reverse geocoding failed — fall back to generic label, weather still loads fine
      }
      cities[slotIndex] = { name, region, lat, lon };
      saveCities();
      loadSlot(slotIndex);
    },
    (err)=>{
      if(btn){ btn.disabled = false; btn.textContent = '📍 My location'; }
      alert('Could not get your location: ' + err.message);
    },
    { enableHighAccuracy:false, timeout:10000 }
  );
}

document.getElementById('searchOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='searchOverlay') closeSearch();
});

renderAllPanels();

// Try to set the FIRST panel to the user's current location via browser geolocation.
// Slots 1 and 2 are left untouched — only cities[0] is affected.
function useCurrentLocationForFirstSlot(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    let name = 'Current Location';
    let region = '';
    try{
      const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
      const geo = await res.json();
      name = geo.city || geo.locality || name;
      region = [geo.principalSubdivision, geo.countryName].filter(Boolean).join(', ');
    }catch(e){
      // reverse geocoding failed — still use the coordinates with a generic label
    }
    cities[0] = { name, region: region || '—', lat, lon };
    saveCities();
    loadSlot(0);
  }, ()=>{
    // permission denied or unavailable — keep whatever slot 0 already had
  });
}
useCurrentLocationForFirstSlot();

</script>
